# Clothing Detection Dataset Configuration
# This configuration uses COCO dataset filtered for clothing-related classes
# For training from scratch, you would need a custom clothing dataset

# Dataset path (using COCO as base)
path: coco  # dataset root dir
train: images/train2017  # train images (relative to 'path')
val: images/val2017  # val images (relative to 'path')

# Classes - clothing and accessory items from COCO
names:
  0: person  # included for context (wearing clothes)
  1: backpack
  2: umbrella
  3: handbag
  4: tie
  5: suitcase

# Number of classes
nc: 6

# Optional: Download COCO dataset
# download: |
#   from ultralytics.data.utils import download
#   download('https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip')
