# ✅ macOS ARM64 (M1/M2/M3):  Fully supported with native ARM wheels
# ⚠️  Linux ARM64 (Raspberry Pi, Graviton):  Requires special installation
# ❌ Linux ARMv7 (32-bit Pi):  PyTorch/OpenVINO must be built from source
#
# For ARM platforms, see: ARM_INSTALLATION.md
