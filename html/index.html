<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion MNIST — Benchmark Results</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e6ed;
    --muted: #8b8fa3;
    --accent: #6c8cff;
    --green: #4caf87;
    --orange: #e8a838;
    --red: #e05555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    line-height: 1.6;
  }
  h1 { font-size: 1.6rem; margin-bottom: .25rem; }
  .subtitle { color: var(--muted); margin-bottom: 1.5rem; font-size: .9rem; }

  /* file loading */
  .load-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    cursor: pointer;
    transition: border-color .2s;
  }
  .load-area.drag-over { border-color: var(--accent); background: rgba(108,140,255,.04); }
  .load-area:hover { border-color: var(--accent); }
  .load-area input { display: none; }
  .load-area p { color: var(--muted); }

  /* selector panel */
  .selector-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    margin-bottom: 2rem;
  }
  .selector-panel h2 { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .75rem; }
  .selector-list { display: flex; flex-wrap: wrap; gap: .5rem; }
  .selector-item {
    display: flex; align-items: center; gap: .45rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .4rem .75rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .selector-item:hover { border-color: var(--accent); }
  .selector-item.active { border-color: var(--accent); background: rgba(108,140,255,.08); }
  .selector-item input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
  .selector-item .swatch {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .selector-item label { font-size: .85rem; cursor: pointer; }
  .selector-actions { margin-top: .6rem; display: flex; gap: .5rem; }
  .selector-actions button {
    background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 4px;
    padding: .25rem .65rem; font-size: .75rem; cursor: pointer; transition: color .15s, border-color .15s;
  }
  .selector-actions button:hover { color: var(--text); border-color: var(--accent); }

  /* summary cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem;
  }
  .card h3 { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .5rem; }
  .card .value { font-size: 1.6rem; font-weight: 700; }
  .card .unit { font-size: .85rem; color: var(--muted); }

  /* chart containers */
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
  }
  .chart-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem;
  }
  .chart-box h3 {
    font-size: .85rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: .75rem;
  }
  .chart-box canvas { width: 100%; height: 260px; }

  /* per-class chart (full width) */
  .chart-full {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem;
    margin-bottom: 2rem;
  }
  .chart-full h3 {
    font-size: .85rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: .75rem;
  }
  .chart-full canvas { width: 100%; height: 340px; }

  /* tables */
  .table-wrap { overflow-x: auto; margin-bottom: 2rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: .6rem .8rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: .75rem; letter-spacing: .06em; }
  tr:hover { background: rgba(108,140,255,.06); }

  .section-title { font-size: 1.1rem; margin: 2rem 0 .75rem; }
  .sys-info { font-size: .82rem; color: var(--muted); margin-bottom: 1.5rem; }
  .sys-info span { color: var(--muted); }

  #no-data { text-align: center; color: var(--muted); padding: 4rem 0; }
  .hidden { display: none !important; }

  .pill {
    display: inline-block; padding: .15rem .5rem; border-radius: 4px;
    font-size: .75rem; font-weight: 600; text-transform: uppercase;
  }
  .pill-fp32 { background: rgba(108,140,255,.15); color: var(--accent); }
  .pill-int8 { background: rgba(76,175,135,.15); color: var(--green); }
  .pill-int4 { background: rgba(232,168,56,.15); color: var(--orange); }

  /* legend */
  .chart-legend { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .5rem; justify-content: center; }
  .chart-legend-item { display: flex; align-items: center; gap: .3rem; font-size: .78rem; color: var(--muted); }
  .chart-legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<h1>Fashion MNIST — Benchmark Results</h1>
<p class="subtitle" id="statusLine">Loading benchmarks&hellip;</p>

<div class="load-area" id="dropZone">
  <p>Drop JSON logs here or <label for="fileInput" style="color:var(--accent);cursor:pointer;text-decoration:underline">browse files</label></p>
  <input type="file" id="fileInput" accept=".json" multiple>
</div>

<div id="selectorPanel" class="selector-panel hidden">
  <h2>Loaded Benchmarks</h2>
  <div class="selector-list" id="selectorList"></div>
  <div class="selector-actions">
    <button id="btnSelectAll">Select All</button>
    <button id="btnDeselectAll">Deselect All</button>
    <button id="btnClearAll">Clear Loaded</button>
  </div>
</div>

<div id="no-data"><p>No benchmark data loaded.</p></div>
<div id="dashboard" class="hidden"></div>

<script>
(function () {
  "use strict";

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  const dropZone = $("#dropZone");
  const fileInput = $("#fileInput");
  const dashboard = $("#dashboard");
  const noData = $("#no-data");
  const selectorPanel = $("#selectorPanel");
  const selectorList = $("#selectorList");

  // palette for benchmarks
  const PALETTE = [
    "#6c8cff", "#4caf87", "#e8a838", "#e05555", "#a78bfa",
    "#f472b6", "#38bdf8", "#facc15", "#34d399", "#fb923c"
  ];

  /** @type {{ id: string, data: object, color: string, selected: boolean }[]} */
  let entries = [];
  let colorIdx = 0;

  // ── helpers ───────────────────────────────────────────────────────────────

  function makeId(b) {
    return `${b.variant}_${b.device}_${b.timestamp}`;
  }

  function pillClass(variant) {
    if (variant.includes("int4")) return "pill-int4";
    if (variant.includes("int8")) return "pill-int8";
    return "pill-fp32";
  }

  function label(entry) {
    const d = entry.data;
    const proc = (d.system_info && d.system_info.processor) ? d.system_info.processor : "";
    const short = proc.length > 30 ? proc.slice(0, 28) + "…" : proc;
    return `${d.variant.toUpperCase()} / ${d.device}` + (short ? ` (${short})` : "");
  }

  // ── file loading ──────────────────────────────────────────────────────────

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("drag-over");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    handleFiles(e.dataTransfer.files);
  });
  dropZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { handleFiles(fileInput.files); fileInput.value = ""; });

  function handleFiles(files) {
    const readers = [];
    for (const f of files) {
      readers.push(
        f.text().then((text) => {
          const parsed = JSON.parse(text);
          return Array.isArray(parsed) ? parsed : [parsed];
        })
      );
    }
    Promise.all(readers).then((results) => {
      addBenchmarks(results.flat());
    });
  }

  /** Shared ingest: dedupes, assigns colors, and re-renders. */
  function addBenchmarks(items) {
    for (const b of items) {
      if (!b || !b.variant || !b.device) continue;
      const id = makeId(b);
      if (entries.find((e) => e.id === id)) continue;
      entries.push({ id, data: b, color: PALETTE[colorIdx++ % PALETTE.length], selected: true });
    }
    renderSelector();
    render();
  }

  // ── auto-load from benchmark_logs ─────────────────────────────────────────

  const BENCHMARK_DIR = "../benchmark_logs";

  /**
   * Auto-load strategy (in order):
   * 1. manifest.json  → fetch every file listed in it
   * 2. all_benchmarks.json → combined file
   * 3. well-known individual files (legacy fallback)
   */
  async function autoLoad() {
    const statusLine = $("#statusLine");

    // Strategy 1: manifest.json
    try {
      const mResp = await fetch(`${BENCHMARK_DIR}/manifest.json`);
      if (mResp.ok) {
        const manifest = await mResp.json();
        const files = manifest.files || [];
        // Fetch all listed files in parallel
        const fetches = files.map((name) =>
          fetch(`${BENCHMARK_DIR}/${name}`)
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null)
        );
        const results = await Promise.all(fetches);
        const items = results
          .filter(Boolean)
          .flatMap((r) => (Array.isArray(r) ? r : [r]));
        if (items.length) {
          addBenchmarks(items);
          statusLine.textContent = `Auto-loaded ${entries.length} benchmark(s) via manifest. Drop more files to add.`;
          return;
        }
      }
    } catch (_) { /* ignore – try next strategy */ }

    // Strategy 2: all_benchmarks.json
    try {
      const resp = await fetch(`${BENCHMARK_DIR}/all_benchmarks.json`);
      if (resp.ok) {
        const parsed = await resp.json();
        addBenchmarks(Array.isArray(parsed) ? parsed : [parsed]);
        statusLine.textContent = `Auto-loaded ${entries.length} benchmark(s). Drop more files to add.`;
        return;
      }
    } catch (_) { /* ignore – try individual files */ }

    // Strategy 3: legacy well-known filenames
    const individual = ["fp32_cpu.json", "int8_cpu.json", "int4_cpu.json"];
    const fetches = individual.map((name) =>
      fetch(`${BENCHMARK_DIR}/${name}`)
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null)
    );
    const results = await Promise.all(fetches);
    const items = results.filter(Boolean).flatMap((r) => (Array.isArray(r) ? r : [r]));
    if (items.length) {
      addBenchmarks(items);
      statusLine.textContent = `Auto-loaded ${entries.length} benchmark(s). Drop more files to add.`;
    } else {
      statusLine.textContent = "No logs found — drop benchmark JSON files to visualise.";
    }
  }

  autoLoad();

  // ── selector panel ────────────────────────────────────────────────────────

  $("#btnSelectAll").addEventListener("click", () => { entries.forEach((e) => (e.selected = true)); renderSelector(); render(); });
  $("#btnDeselectAll").addEventListener("click", () => { entries.forEach((e) => (e.selected = false)); renderSelector(); render(); });
  $("#btnClearAll").addEventListener("click", () => { entries = []; colorIdx = 0; renderSelector(); render(); });

  function renderSelector() {
    if (!entries.length) { selectorPanel.classList.add("hidden"); return; }
    selectorPanel.classList.remove("hidden");
    selectorList.innerHTML = "";
    for (const entry of entries) {
      const item = document.createElement("div");
      item.className = "selector-item" + (entry.selected ? " active" : "");
      item.innerHTML = `
        <input type="checkbox" ${entry.selected ? "checked" : ""}>
        <span class="swatch" style="background:${entry.color}"></span>
        <label>${label(entry)}</label>`;
      item.addEventListener("click", (e) => {
        if (e.target.tagName === "INPUT") {
          entry.selected = e.target.checked;
        } else {
          entry.selected = !entry.selected;
        }
        renderSelector();
        render();
      });
      selectorList.appendChild(item);
    }
  }

  // ── canvas chart helpers ──────────────────────────────────────────────────

  const DPR = window.devicePixelRatio || 1;

  function initCanvas(canvas) {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * DPR;
    canvas.height = rect.height * DPR;
    const ctx = canvas.getContext("2d");
    ctx.scale(DPR, DPR);
    return { ctx, w: rect.width, h: rect.height };
  }

  /**
   * Draw a grouped vertical bar chart.
   * @param {HTMLCanvasElement} canvas
   * @param {string[]} labels – category labels
   * @param {{ label: string, color: string, values: number[] }[]} datasets
   * @param {{ unit?: string, decimals?: number, maxOverride?: number }} opts
   */
  function drawBarChart(canvas, labels, datasets, opts = {}) {
    const { ctx, w, h } = initCanvas(canvas);
    const pad = { top: 20, right: 20, bottom: 54, left: 60 };
    const chartW = w - pad.left - pad.right;
    const chartH = h - pad.top - pad.bottom;

    // compute max
    let maxVal = 0;
    for (const ds of datasets) for (const v of ds.values) if (v > maxVal) maxVal = v;
    if (opts.maxOverride !== undefined) maxVal = Math.max(maxVal, opts.maxOverride);
    if (maxVal === 0) maxVal = 1;
    const niceMax = ceilNice(maxVal);
    const ticks = 5;

    ctx.clearRect(0, 0, w, h);

    // gridlines + y labels
    ctx.strokeStyle = "rgba(42,45,58,.8)";
    ctx.fillStyle = "#8b8fa3";
    ctx.font = "11px -apple-system, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let i = 0; i <= ticks; i++) {
      const val = (niceMax / ticks) * i;
      const y = pad.top + chartH - (val / niceMax) * chartH;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      ctx.fillText(val.toFixed(opts.decimals ?? 1) + (opts.unit || ""), pad.left - 6, y);
    }

    // bars
    const groupCount = labels.length;
    const barCount = datasets.length;
    const groupWidth = chartW / groupCount;
    const barGap = 3;
    const totalBarSpace = groupWidth * 0.7;
    const barW = Math.max(4, (totalBarSpace - barGap * (barCount - 1)) / barCount);

    for (let g = 0; g < groupCount; g++) {
      const groupX = pad.left + g * groupWidth + (groupWidth - (barW * barCount + barGap * (barCount - 1))) / 2;
      for (let d = 0; d < barCount; d++) {
        const val = datasets[d].values[g] ?? 0;
        const barH = (val / niceMax) * chartH;
        const x = groupX + d * (barW + barGap);
        const y = pad.top + chartH - barH;

        ctx.fillStyle = datasets[d].color;
        ctx.beginPath();
        roundRect(ctx, x, y, barW, barH, 3);
        ctx.fill();

        // value on top
        if (barCount <= 4 && groupCount <= 5) {
          ctx.fillStyle = "#e4e6ed";
          ctx.font = "bold 10px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(val.toFixed(opts.decimals ?? 1), x + barW / 2, y - 3);
        }
      }

      // x label
      ctx.fillStyle = "#8b8fa3";
      ctx.font = "11px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const labelX = pad.left + g * groupWidth + groupWidth / 2;
      wrapText(ctx, labels[g], labelX, pad.top + chartH + 8, groupWidth - 4, 12);
    }
  }

  function ceilNice(v) {
    if (v <= 0) return 1;
    const order = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / order;
    let nice;
    if (f <= 1) nice = 1;
    else if (f <= 2) nice = 2;
    else if (f <= 5) nice = 5;
    else nice = 10;
    return nice * order;
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (h < 1) { ctx.rect(x, y, w, h); return; }
    r = Math.min(r, h / 2, w / 2);
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(/[\s/]+/);
    let line = "";
    let ly = y;
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, ly);
        line = word;
        ly += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, ly);
  }

  // ── main render ───────────────────────────────────────────────────────────

  function render() {
    const selected = entries.filter((e) => e.selected);
    if (!selected.length) {
      noData.classList.remove("hidden");
      dashboard.classList.add("hidden");
      if (!entries.length) noData.querySelector("p").textContent = "No benchmark data loaded.";
      else noData.querySelector("p").textContent = "Select at least one benchmark to visualise.";
      return;
    }
    noData.classList.add("hidden");
    dashboard.classList.remove("hidden");

    const benchmarks = selected.map((e) => e.data);

    let html = "";

    // ── summary cards ──────────────────────────────────────────────────────
    const best = benchmarks.reduce((a, b) => a.accuracy_pct > b.accuracy_pct ? a : b);
    const fastest = benchmarks.reduce((a, b) => a.avg_latency_ms < b.avg_latency_ms ? a : b);
    const quickest = benchmarks.reduce((a, b) => a.total_time_s < b.total_time_s ? a : b);

    html += `<div class="cards">
      <div class="card"><h3>Best Accuracy</h3><div class="value">${best.accuracy_pct}<span class="unit">%</span></div><div class="unit">${best.variant.toUpperCase()} / ${best.device}</div></div>
      <div class="card"><h3>Lowest Latency</h3><div class="value">${fastest.avg_latency_ms.toFixed(3)}<span class="unit"> ms</span></div><div class="unit">${fastest.variant.toUpperCase()} / ${fastest.device}</div></div>
      <div class="card"><h3>Fastest Total</h3><div class="value">${quickest.total_time_s.toFixed(2)}<span class="unit"> s</span></div><div class="unit">${quickest.variant.toUpperCase()} / ${quickest.device}</div></div>
      <div class="card"><h3>Selected Runs</h3><div class="value">${benchmarks.length}</div><div class="unit">of ${entries.length} loaded</div></div>
    </div>`;

    // ── comparison charts ──────────────────────────────────────────────────
    html += `<div class="chart-grid">
      <div class="chart-box"><h3>Accuracy (%)</h3><canvas id="chartAccuracy"></canvas><div class="chart-legend" id="legendAccuracy"></div></div>
      <div class="chart-box"><h3>Avg Latency (ms)</h3><canvas id="chartLatency"></canvas><div class="chart-legend" id="legendLatency"></div></div>
    </div>`;
    html += `<div class="chart-grid">
      <div class="chart-box"><h3>Total Inference Time (s)</h3><canvas id="chartTotal"></canvas><div class="chart-legend" id="legendTotal"></div></div>
      <div class="chart-box"><h3>Throughput (img/s)</h3><canvas id="chartThroughput"></canvas><div class="chart-legend" id="legendThroughput"></div></div>
    </div>`;

    // ── per-class accuracy grouped chart ────────────────────────────────────
    const hasPerClass = selected.some((e) => e.data.per_class_accuracy);
    if (hasPerClass) {
      html += `<div class="chart-full"><h3>Per-Class Accuracy (%)</h3><canvas id="chartPerClass"></canvas><div class="chart-legend" id="legendPerClass"></div></div>`;
    }

    // ── comparison table ────────────────────────────────────────────────────
    html += `<h2 class="section-title">Comparison Table</h2>`;
    html += `<div class="table-wrap"><table>
      <thead><tr><th></th><th>Variant</th><th>Device</th><th>Processor</th><th>Accuracy</th><th>Avg Latency</th><th>Total Time</th><th>Throughput</th><th>Images</th><th>Timestamp</th></tr></thead><tbody>`;
    for (const entry of selected) {
      const b = entry.data;
      const throughput = b.total_time_s > 0 ? (b.total_images / b.total_time_s).toFixed(1) : "—";
      const proc = (b.system_info && b.system_info.processor) ? b.system_info.processor : "—";
      const ts = b.timestamp ? new Date(b.timestamp).toLocaleString() : "—";
      html += `<tr>
        <td><span class="swatch" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${entry.color}"></span></td>
        <td><span class="pill ${pillClass(b.variant)}">${b.variant}</span></td>
        <td>${b.device}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${proc}">${proc}</td>
        <td>${b.accuracy_pct}%</td>
        <td>${b.avg_latency_ms.toFixed(4)} ms</td>
        <td>${b.total_time_s.toFixed(3)} s</td>
        <td>${throughput} img/s</td>
        <td>${b.total_images}</td>
        <td>${ts}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;

    // ── system info ─────────────────────────────────────────────────────────
    const sysEntries = selected.filter((e) => e.data.system_info);
    if (sysEntries.length) {
      html += `<h2 class="section-title">System Info</h2>`;
      for (const entry of sysEntries) {
        const s = entry.data.system_info;
        html += `<p class="sys-info"><span class="swatch" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${entry.color};vertical-align:middle"></span> <strong>${entry.data.variant.toUpperCase()} / ${entry.data.device}</strong> — <span>${s.system} ${s.machine} · ${s.processor || "unknown"} · Python ${s.python_version} · ${s.hostname}</span></p>`;
      }
    }

    dashboard.innerHTML = html;

    // ── draw charts after DOM update ────────────────────────────────────────
    requestAnimationFrame(() => {
      drawSingleBarChart($("#chartAccuracy"), selected, (b) => b.accuracy_pct, { unit: "%", decimals: 1, maxOverride: 100 });
      drawSingleBarChart($("#chartLatency"), selected, (b) => b.avg_latency_ms, { unit: " ms", decimals: 3 });
      drawSingleBarChart($("#chartTotal"), selected, (b) => b.total_time_s, { unit: " s", decimals: 2 });
      drawSingleBarChart($("#chartThroughput"), selected, (b) => b.total_time_s > 0 ? b.total_images / b.total_time_s : 0, { unit: "", decimals: 0 });

      buildLegend($("#legendAccuracy"), selected);
      buildLegend($("#legendLatency"), selected);
      buildLegend($("#legendTotal"), selected);
      buildLegend($("#legendThroughput"), selected);

      if (hasPerClass) {
        // Collect all class names from first entry that has per_class_accuracy
        const classNames = Object.keys(selected.find((e) => e.data.per_class_accuracy).data.per_class_accuracy);
        const datasets = selected.map((e) => ({
          label: label(e),
          color: e.color,
          values: classNames.map((c) => (e.data.per_class_accuracy && e.data.per_class_accuracy[c]) ?? 0)
        }));
        drawBarChart($("#chartPerClass"), classNames, datasets, { unit: "%", decimals: 1, maxOverride: 100 });
        buildLegend($("#legendPerClass"), selected);
      }
    });
  }

  /**
   * Draw a simple one-bar-per-benchmark chart.
   */
  function drawSingleBarChart(canvas, selected, valueFn, opts = {}) {
    const labels = selected.map((e) => `${e.data.variant.toUpperCase()} / ${e.data.device}`);
    const datasets = selected.map((e) => ({
      label: label(e),
      color: e.color,
      values: [valueFn(e.data)]
    }));
    // For single-value-per-entry, we use each entry as a separate group with 1 bar
    const singleLabels = selected.map((e) => `${e.data.variant.toUpperCase()}\n${e.data.device}`);
    const singleDatasets = [{
      label: "",
      color: "",
      values: []
    }];
    // Actually, draw as grouped with 1 dataset per entry, 1 group total — no.
    // Better: draw as 1 dataset, N groups.
    const oneDataset = [{
      label: "value",
      color: "#6c8cff",
      values: selected.map((e) => valueFn(e.data))
    }];
    // Override colors per bar by drawing manually
    drawColoredBarChart(canvas, selected, valueFn, opts);
  }

  function drawColoredBarChart(canvas, selected, valueFn, opts = {}) {
    const { ctx, w, h } = initCanvas(canvas);
    const pad = { top: 20, right: 20, bottom: 54, left: 60 };
    const chartW = w - pad.left - pad.right;
    const chartH = h - pad.top - pad.bottom;

    const values = selected.map((e) => valueFn(e.data));
    let maxVal = Math.max(...values, 0);
    if (opts.maxOverride !== undefined) maxVal = Math.max(maxVal, opts.maxOverride);
    if (maxVal === 0) maxVal = 1;
    const niceMax = ceilNice(maxVal);
    const ticks = 5;

    ctx.clearRect(0, 0, w, h);

    // gridlines + y labels
    ctx.strokeStyle = "rgba(42,45,58,.8)";
    ctx.fillStyle = "#8b8fa3";
    ctx.font = "11px -apple-system, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let i = 0; i <= ticks; i++) {
      const val = (niceMax / ticks) * i;
      const y = pad.top + chartH - (val / niceMax) * chartH;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      ctx.fillText(val.toFixed(opts.decimals ?? 1) + (opts.unit || ""), pad.left - 6, y);
    }

    // bars
    const n = selected.length;
    const groupWidth = chartW / n;
    const barW = Math.max(4, groupWidth * 0.6);

    for (let i = 0; i < n; i++) {
      const val = values[i];
      const barH = (val / niceMax) * chartH;
      const x = pad.left + i * groupWidth + (groupWidth - barW) / 2;
      const y = pad.top + chartH - barH;

      ctx.fillStyle = selected[i].color;
      ctx.beginPath();
      roundRect(ctx, x, y, barW, barH, 3);
      ctx.fill();

      // value on top
      ctx.fillStyle = "#e4e6ed";
      ctx.font = "bold 10px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText(val.toFixed(opts.decimals ?? 1), x + barW / 2, y - 3);

      // x label
      ctx.fillStyle = "#8b8fa3";
      ctx.font = "11px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const lx = pad.left + i * groupWidth + groupWidth / 2;
      wrapText(ctx, `${selected[i].data.variant.toUpperCase()} / ${selected[i].data.device}`, lx, pad.top + chartH + 8, groupWidth - 4, 12);
    }
  }

  function buildLegend(container, selected) {
    if (!container) return;
    container.innerHTML = selected.map((e) =>
      `<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:${e.color}"></span>${label(e)}</span>`
    ).join("");
  }

  // ── resize handling ───────────────────────────────────────────────────────
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (entries.some((e) => e.selected)) render(); }, 200);
  });
})();
</script>
